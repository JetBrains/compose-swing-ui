config:
  warningsAsErrors: true

comments:
  DeprecatedBlockTag:
    active: true
  EndOfSentenceFormat:
    active: true
  KDocReferencesNonPublicProperty:
    active: true
  OutdatedDocumentation:
    active: true
    # A type parameter is named by the signature it appears in - `ListBox<T>(items: List<T>)` already
    # says what T is - so only value parameters have to be documented.
    matchTypeParameters: false
  # detekt's default excludes match any path with a `test` directory segment, which would exempt
  # swing-ui-test's `org.jetbrains.compose.swing.test` production package by accident; scope the
  # exclude to the test source set instead so a published module named "test" stays covered.
  UndocumentedPublicClass:
    active: true
    excludes: ["**/src/test/**"]
  UndocumentedPublicFunction:
    active: true
    excludes: ["**/src/test/**"]
  UndocumentedPublicProperty:
    active: true
    excludes: ["**/src/test/**"]

complexity:
  LongParameterList:
    # Many-parameter @Composable component wrappers are the idiomatic Compose pattern (CMP's own
    # components carry many params); collapsing them would harm the public, Compose-shaped API. Same
    # precedented exemption as MagicNumber below.
    ignoreAnnotated: ["Composable"]

naming:
  FunctionNaming:
    # @Composable functions use PascalCase by Compose convention (e.g. Button, BorderPanel).
    ignoreAnnotated: ["Composable"]

style:
  UnusedPrivateFunction:
    # A @Preview function is invoked reflectively by the preview tooling, never from source, so being
    # private is correct and being unreferenced is not a defect.
    ignoreAnnotated: ["Preview"]

  MagicNumber:
    # Default UI dimensions / parameters inside @Composable functions read fine inline.
    ignoreAnnotated: ["Composable"]
  # ktlint reports no unused import, whatever the import is, so without this rule nothing in the
  # build notices one. It resolves the references it counts, and runs in detektMain/detektTest,
  # which `check` depends on.
  UnusedImport:
    active: true
