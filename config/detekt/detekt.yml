config:
  warningsAsErrors: true

comments:
  DeprecatedBlockTag:
    active: true
  EndOfSentenceFormat:
    active: true
  KDocReferencesNonPublicProperty:
    active: true
  OutdatedDocumentation:
    active: true
    # A type parameter is named by the signature it appears in - `ListBox<T>(items: List<T>)` already
    # says what T is - so only value parameters have to be documented.
    matchTypeParameters: false
  # detekt's default excludes match any path with a `test` directory segment, which would exempt
  # swing-ui-test's `org.jetbrains.compose.swing.test` production package by accident; scope the
  # exclude to the test source set instead so a published module named "test" stays covered.
  #
  # Fixtures are unpublished test-support code whose public declarations exist only for other modules'
  # tests and benchmarks, so the rules for published API skip them as they skip src/test.
  UndocumentedPublicClass:
    active: true
    excludes: ["**/src/test/**", "**/src/fixtures/**"]
  UndocumentedPublicFunction:
    active: true
    excludes: ["**/src/test/**", "**/src/fixtures/**"]
  UndocumentedPublicProperty:
    active: true
    excludes: ["**/src/test/**", "**/src/fixtures/**"]

complexity:
  LongParameterList:
    # Many-parameter @Composable component wrappers are the idiomatic Compose pattern (CMP's own
    # components carry many params); collapsing them would harm the public, Compose-shaped API. Same
    # precedented exemption as MagicNumber below.
    ignoreAnnotated: ["Composable"]

# Several of these rules ask how an API is shaped or what a composition costs. A test fixture is
# neither: it stands a composable up to drive one assertion and is gone.
compose-swing:
  CompositionLocalAllowlist:
    excludes: ["**/src/test/**"]
    # Layout constraints and the window a content composition has settled on are part of this
    # framework's design, not an app's implicit dependency.
    allowedCompositionLocals: ['LocalProvidableWindow']
  LambdaParameterInRestartableEffect:
    excludes: ["**/src/test/**"]
  MissingNonRestartableComposable:
    excludes: ["**/src/fixtures/**"]
  ModifierMissing:
    excludes: ["**/src/fixtures/**"]
  ParameterNaming:
    excludes: ["**/src/fixtures/**"]
    # Settlement is this library's own vocabulary, and the callback fires once the value has settled.
    allowedLambdaParameterNames: ['onValueSettled']
  StateParam:
    excludes: ["**/src/test/**"]
  VarsWithoutStateBacking:
    excludes: ["**/src/test/**"]

# Off by default in the artifact: these say nothing about what the library requires, and are declared
# there only because no published ruleset provides them. This repository holds itself to them.
compose-swing-internal:
  PreferImportsOverFqn:
    active: true
  PublicDataClass:
    active: true
    excludes: ["**/src/fixtures/**"]

naming:
  FunctionNaming:
    # @Composable functions use PascalCase by Compose convention (e.g. Button, Panel).
    ignoreAnnotated: ["Composable"]

style:
  ForbiddenImport:
    active: true
    # A rule is written against the host-neutral API, so the same class runs under detekt and in the IDE.
    includes: ['**/org/jetbrains/compose/swing/rules/**']
    forbiddenImports:
      - value: 'dev.detekt.*'
        reason: 'A rule in this package stays independent of detekt; the adapters in the detekt package carry it there.'
      - value: 'io.nlopez.compose.rules.detekt.*'
        reason: 'compose-rules'' detekt classes extend detekt''s Rule, so a rule in this package must not depend on them either.'
  MagicNumber:
    excludes: ['**/test/**', '**/*.kts', "**/src/fixtures/**"]
    # Default UI dimensions / parameters inside @Composable functions read fine inline.
    ignoreAnnotated: ["Composable"]
  # ktlint reports no unused import, whatever the import is, so without this rule nothing in the
  # build notices one. It resolves the references it counts, and runs in detektMain/detektTest,
  # which `check` depends on.
  UnusedImport:
    active: true
