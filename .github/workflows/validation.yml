name: Validation

on:
  workflow_call:

env:
  ANDROIDX_FORKS: :swing-ui-foundation :swing-ui-animation
  # The Static Analysis job runs exactly the tasks the verify jobs exclude. A task `check` reaches
  # that is missing here still runs in verify.
  STATIC_ANALYSIS: >-
    lint detekt detektMain detektTest detektTestFixtures
    ktlintKotlinScriptCheck ktlintMainSourceSetCheck ktlintTestSourceSetCheck ktlintTestFixturesSourceSetCheck

jobs:
  verify:
    name: Verify (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # A new module is gated here without being listed.
          - group: swing-ui
            tasks: >-
              build $(printf -- '-x %s:build ' $ANDROIDX_FORKS) $(printf -- '-x %s ' $STATIC_ANALYSIS)

          - group: androidx-forks
            tasks: $(printf -- '%s:check ' $ANDROIDX_FORKS) $(printf -- '-x %s ' $STATIC_ANALYSIS)

    steps:
      - uses: actions/checkout@v6
        name: Checkout Repository

      - uses: ./.github/actions/setup-prerequisites
        name: Setup Prerequisites
        with:
          java-version: 21

      - shell: bash
        name: Install Virtual Framebuffer
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - shell: bash
        name: Build & Run Gates
        run: xvfb-run --auto-servernum ./gradlew --no-daemon --stacktrace --continue ${{ matrix.tasks }}

      - uses: ./.github/actions/upload-test-report
        name: Upload Test Report
        if: always()
        with:
          artifact-name: tests-results-${{ matrix.group }}
          upload-artifact: ${{ job.status == 'failure' }}

  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
        name: Checkout Repository

      - uses: ./.github/actions/setup-prerequisites
        name: Setup Prerequisites
        with:
          java-version: 21

      - shell: bash
        name: Run Static Analysis
        run: ./gradlew --no-daemon --stacktrace --continue :buildSrc:ktlintCheck :buildSrc:detekt $STATIC_ANALYSIS

  publishing:
    name: Publishing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
        name: Checkout Repository

      - uses: ./.github/actions/setup-prerequisites
        name: Setup Prerequisites
        with:
          java-version: 21

      - shell: bash
        name: Build API Reference
        run: ./gradlew --no-daemon --stacktrace dokkaGenerate

      - shell: bash
        name: Publish Dry Run
        run: ./gradlew --no-daemon --stacktrace publishToMavenLocal
