name: Upload Test Report
description: Publish the JUnit and JaCoCo coverage reports to the run summary, and optionally upload test artifacts.

inputs:
  artifact-name:
    description: Artifact name used when uploading failure diagnostics.
    required: true
  upload-artifact:
    description: Whether to upload diagnostic artifacts for this run.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Discover Test Report Modules
      id: discover
      shell: bash
      run: |
        MODULES=$(find . -path "*/build/*-results/*" -name "*.xml" \
          | sed -E 's|^\./(.*)/build/.*-results/.*|\1|' \
          | sort -u)

        if [ -z "$MODULES" ]; then
          echo "check_names=JUnit Test Report" >> "$GITHUB_OUTPUT"
          echo "report_paths=**/build/**/*-results/**/*.xml" >> "$GITHUB_OUTPUT"
        else
          {
            echo "check_names<<EOF"
            while IFS= read -r m; do
              [ -n "$m" ] && echo ":${m//\//:}"
            done <<< "$MODULES"
            echo "EOF"

            echo "report_paths<<EOF"
            while IFS= read -r m; do
              [ -n "$m" ] && echo "$m/build/*-results/**/*.xml"
            done <<< "$MODULES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
        fi

    - name: Publish JUnit Report
      uses: mikepenz/action-junit-report@v6
      with:
        check_name: ${{ steps.discover.outputs.check_names }}
        report_paths: ${{ steps.discover.outputs.report_paths }}
        detailed_summary: true
        verbose_summary: false
        fail_on_failure: false
        annotate_only: true

    - name: Publish Coverage Report
      uses: madrapps/jacoco-report@v1
      with:
        paths: "**/build/reports/jacoco/test/jacocoTestReport.xml"
        comment-type: summary
        token: ${{ github.token }}

    - name: Upload Test Results
      if: ${{ inputs.upload-artifact == 'true' }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          **/build/reports/jacoco/**
          **/build/reports/tests/**
          **/build/reports/problems/**
          **/hs_err_pid*.log
          **/replay_pid*.log
          **/java_pid*.hprof
