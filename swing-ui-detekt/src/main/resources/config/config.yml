# Default rules and settings for consumers of this artifact.

compose-swing:
  ArgumentOutsideDeclaredRange:
    active: true
  ComposableAnnotationNaming:
    active: true
  ComposableNestingDepth:
    active: false
    composableNestingDepthThreshold: 3
    contentEmitters: []
    contentEmittersDenylist: []
  ComposableParamOrder:
    active: true
    customModifiers: []
    treatAsLambda: []
    treatAsComposableLambda: []
  ComposableSwingModifierFactory:
    active: true
  CompositionLocalAllowlist:
    active: true
    allowedCompositionLocals: []
  ConditionHoist:
    active: true
    contentEmitters: []
    ignoreCallsWithArgumentNames: ["modifier", "contentAlignment", "horizontalArrangement", "verticalAlignment"]
  ContentEmitterReturningValues:
    active: true
    contentEmitters: []
    contentEmittersDenylist: []
  ContentSlotReused:
    active: true
    treatAsLambda: []
    treatAsComposableLambda: []
  ContentTrailingLambda:
    active: true
    treatAsLambda: []
    treatAsComposableLambda: []
  DefaultsVisibility:
    active: true
  InvalidReadOnlyComposable:
    active: true
  LambdaParameterEventTrailing:
    active: true
    customModifiers: []
    contentEmitters: []
    contentEmittersDenylist: []
  LambdaParameterInRestartableEffect:
    active: true
    treatAsLambda: []
  MissingNonRestartableComposable:
    active: true
    ignoresPreviews: true
  MissingReadOnlyComposable:
    active: true
  ModifierComposed:
    active: true
    customModifiers: []
  ModifierMissing:
    active: true
    modifierMissingIgnoreAnnotated: []
    checkModifiersForVisibility: 'only_public'
    ignoreAnnotated: []
    customModifiers: []
    contentEmitters: []
    contentEmittersDenylist: []
  ModifierNaming:
    active: true
    customModifiers: []
  ModifierNodeInspectableProperties:
    active: true
    # An element declared in a test describes itself to nothing - no tool reads a fixture. Scoped to
    # the test source set rather than detekt's default `test` segment match, so a published module
    # whose own package is named "test" stays covered.
    excludes: ["**/src/test/**"]
  ModifierNotUsedAtRoot:
    active: true
    customModifiers: []
    contentEmitters: []
    contentEmittersDenylist: []
  ModifierReused:
    active: true
    customModifiers: []
    contentEmitters: []
    contentEmittersDenylist: []
  ModifierShouldBeForwardedToEveryBranch:
    active: true
    customModifiers: []
  MultipleEmitters:
    active: true
    contentEmitters: []
    contentEmittersDenylist: []
  MultipleSwingModifierParameters:
    active: true
  MultipleSwingNodeCalls:
    active: true
  MutableParams:
    active: true
  MutableStateParam:
    active: true
  ParameterNaming:
    active: true
    allowedLambdaParameterNames: []
    treatAsLambda: []
  PreviewAnnotationNaming:
    active: true
  PreviewNaming:
    active: false
    previewNamingStrategy: 'suffix'
  PreviewNeedsComposableAnnotation:
    active: true
  PreviewPublic:
    active: true
  PreviewSignature:
    active: true
  RememberContentMissing:
    active: true
  RestrictedApi:
    active: true
  StaleRememberUpdatedStateInRemember:
    active: true
  StateParam:
    active: true
  SwingComponentInComposableSignature:
    active: true
  SwingModifierFactoryExtensionFunction:
    active: true
  SwingModifierFactoryReturnType:
    active: true
  SwingModifierThen:
    active: true
  SwingModifierUnreferencedReceiver:
    active: true
  SwingModifierWithoutDefault:
    active: true
  SwingNodeFactoryReadsDeclaredValue:
    active: true
  SwingNodeFactoryReusesComponent:
    active: true
  SwingNodeUpdateConditionalCall:
    active: true
  SwingNodeUpdateRepeatsInvalidation:
    active: true
  SwingNodeUpdateStoresCallback:
    active: true
  SwingNodeUpdateWritesComponentPart:
    active: true
  SwingStyleWithoutDefault:
    active: true
  UnheldColumnComparator:
    active: true
  UnnecessaryComposable:
    active: true
  UnnecessaryLaunchedEffect:
    active: true
    allowedCallReceiverTypes: []
    allowedCallNames: []
  UnstableCollections:
    active: false
  UnusedAnimatedContentTargetState:
    active: true
  UnusedTransitionTargetState:
    active: true
  VarsWithoutStateBacking:
    active: true
  VisibleForTests:
    active: true

compose-swing-internal:
  PreferImportsOverFqn:
    active: false
  PublicDataClass:
    active: false

compose-runtime:
  AutoboxingStateValueProperty:
    active: true
    severity: warning
  ComposableLambdaParameterNaming:
    active: false
    severity: warning
  ComposableLambdaParameterPosition:
    active: false
    severity: warning
  ComposableNaming:
    active: true
    allowedComposableFunctionNames: []
  CompositionLocalNaming:
    active: true
  CoroutineCreationDuringComposition:
    active: true
  FlowOperatorInvokedInComposition:
    active: true
  FrequentlyChangingValue:
    active: true
    severity: warning
  MutableCollectionMutableState:
    active: true
    severity: warning
  MutableStateAutoboxing:
    active: true
    severity: warning
  OpaqueUnitKey:
