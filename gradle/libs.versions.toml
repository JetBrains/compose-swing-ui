[versions]
androidLint = "9.3.2"
androidxAnnotation = "1.8.1"
androidxCollection = "1.5.0"
androidxLifecycle = "2.9.4"
androidxNavigation3 = "1.1.0"
androidxRoom3 = "3.0.3"
androidxSqlite = "2.7.1"
androidxTracing = "2.0.0"
compose = "1.10.0"
composeRules = "0.6.6"
coroutines = "1.9.0"
detekt = "2.0.0-alpha.6"
dokka = "2.2.0"
flatlaf = "3.7.2"
ikonli = "12.4.0"
jetbrainsAnnotations = "23.0.0"
knit = "0.5.1"
kotlin = "2.4.20"
ktlint = "1.8.0"
ktlint-gradle = "14.2.0"
kotlinxSerialization = "1.11.0"
ksp = "2.3.12"
markdown = "0.7.18"
mockk = "1.14.11"

[libraries]
androidLint-gradle-plugin = { module = "com.android.lint:com.android.lint.gradle.plugin", version.ref = "androidLint" }
androidxAnnotation = { module = "androidx.annotation:annotation", version.ref = "androidxAnnotation" }
androidxCollection = { module = "androidx.collection:collection", version.ref = "androidxCollection" }
androidxLifecycleRuntimeCompose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
androidxNavigation3Runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "androidxNavigation3" }
androidxRoom3Compiler = { module = "androidx.room3:room3-compiler", version.ref = "androidxRoom3" }
androidxRoom3Runtime = { module = "androidx.room3:room3-runtime", version.ref = "androidxRoom3" }
androidxSqliteBundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "androidxSqlite" }
androidxTracing = { module = "androidx.tracing:tracing", version.ref = "androidxTracing" }
composeRuntimeLint = { module = "androidx.compose.runtime:runtime-lint", version.ref = "compose" }
composeRulesDetekt = { module = "io.nlopez.compose.rules:detekt", version.ref = "composeRules" }
composeRuntime = { module = "androidx.compose.runtime:runtime", version.ref = "compose" }
composeRuntimeSaveable = { module = "androidx.compose.runtime:runtime-saveable", version.ref = "compose" }
detekt-api = { module = "dev.detekt:detekt-api", version.ref = "detekt" }
detekt-gradle-plugin = { module = "dev.detekt:detekt-gradle-plugin", version.ref = "detekt" }
detekt-test = { module = "dev.detekt:detekt-test", version.ref = "detekt" }
dokka-gradle-plugin = { module = "org.jetbrains.dokka:dokka-gradle-plugin", version.ref = "dokka" }
dokka-versioning-plugin = { module = "org.jetbrains.dokka:versioning-plugin", version.ref = "dokka" }
flatlaf = { module = "com.formdev:flatlaf", version.ref = "flatlaf" }
flatlaf-intellijThemes = { module = "com.formdev:flatlaf-intellij-themes", version.ref = "flatlaf" }
flatlaf-extras = { module = "com.formdev:flatlaf-extras", version.ref = "flatlaf" }
ikonli-featherPack = { module = "org.kordamp.ikonli:ikonli-feather-pack", version.ref = "ikonli" }
ikonli-swing = { module = "org.kordamp.ikonli:ikonli-swing", version.ref = "ikonli" }
jetbrainsAnnotations = { module = "org.jetbrains:annotations", version.ref = "jetbrainsAnnotations" }
junitJupiterParams = { module = "org.junit.jupiter:junit-jupiter-params" }
kotlinComposeCompilerPluginEmbeddable = { module = "org.jetbrains.kotlin:kotlin-compose-compiler-plugin-embeddable", version.ref = "kotlin" }
kotlinComposePlugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
kotlinGradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlinxCoroutinesCore = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinxCoroutinesSwing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }
kotlinxCoroutinesTest = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinxSerializationJson = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
ktlint-gradle-plugin = { module = "org.jlleitschuh.gradle:ktlint-gradle", version.ref = "ktlint-gradle" }
markdown = { module = "org.jetbrains:markdown", version.ref = "markdown" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }

[plugins]
detekt = { id = "dev.detekt", version.ref = "detekt" }
knit = { id = "org.jetbrains.kotlinx.knit", version.ref = "knit" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-gradle" }
room3 = { id = "androidx.room3", version.ref = "androidxRoom3" }
