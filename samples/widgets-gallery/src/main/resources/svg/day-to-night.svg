<!-- Day/night switch artwork, written in the part of SMIL that JSVG both applies and paints correctly.

     Nothing animates a color. A shape that changes color is drawn twice - in its daytime color, with
     its night self fading in over the top - because an animated fill is painted with stray blocks of
     the picture scattered over it on the macOS Metal pipeline. The copy underneath keeps full opacity,
     so the pair stays opaque rather than thinning out halfway. The moon's shadow is likewise two paths
     crossfading rather than one path morphing, because JSVG does not animate `d` at all. Easing belongs
     to whatever drives the timeline, since JSVG ignores `calcMode`, `keySplines` and `keyTimes` and
     always interpolates linearly. And the transition runs once and freezes: rendering the exact moment
     a repeating timeline turns over shows its first frame, which reads as a flash of daylight. -->
